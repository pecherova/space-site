<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>My site</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/pic.css">
</head>
<body>
    <div id="container">
        <div id="header">
            Шапка сайта
        </div>

        <div id="menu">
            <ul>
                <li><a href="#">Главная страница</a></li>
                <li><a href="#">О сайте</a></li>
            </ul>
        </div>

        <div id="content">
            <div class="picture-frame">
            <div class="picture">
                <div class="mushroom-big-stem"></div>
                <div class="mushroom-big-cap"></div>
                
                <div class="mushroom-small">
                    <div class="mushroom-small-stem"></div>
                    <div class="mushroom-small-cap"></div>
                </div>

                <div class="grass"></div>

                <div class="cloud">
                    <div class="cloud-bump cloud-bump-1"></div>
                    <div class="cloud-bump cloud-bump-2"></div>
                </div>

                <div class="dragonfly">
                    <div class="wing wing-1"></div>
                    <div class="wing wing-2"></div>
                    <div class="wing wing-3"></div>
                    <div class="wing wing-4"></div>
                    <div class="fly-body"></div>
                    <div class="fly-head">
                        <div class="fly-eye fly-eye-1"></div>
                        <div class="fly-eye fly-eye-2"></div>
                    </div>
                </div>

            </div>
            </div>
        </div>

        <div id="clear"></div>

        <div id="footer">
            Подвал сайта
        </div>
    </div>
</body>
</html>
