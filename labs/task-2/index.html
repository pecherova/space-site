<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <title>Flexbox-ролик</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="clip">
        <div class="scene scene-static">
            <img class="musk-dance" src="img/mask3.png" alt="Маск с маракасами">
            <img class="rocket-dance" src="img/mask2.png" alt="Ракета">
        </div>
        <div class="scene scene-hover">
            <img class="musk-facepalm" src="img/mask5.png" alt="Маск">
            <p class="caption">Как тебе такое?</p>
            <div class="rocket-zone">
                <img class="rocket-fly" src="img/mask4.png" alt="Ракета с Маском">
            </div>
        </div>
        <div class="scene scene-active">
            <p class="caption caption-vertical">Меня не удивишь</p>
            <div class="musk-point">
                <img class="musk-body" src="img/finger3.png" alt="Маск">
                <img class="finger" src="img/finger2.png" alt="Палец">
            </div>
        </div>
    </div>
</body>

</html>
